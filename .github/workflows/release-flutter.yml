name: Build and Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web-standalone:
    name: Build Standalone HTML Releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies & build
        run: |
          cd decimen-optical-transfer
          npm install
          npm run build:standalone
      - name: Copy releases
        run: |
          mkdir -p released
          cp decimen-optical-transfer/dist-standalone/send/index.html released/decimen-sender.html || cp decimen-optical-transfer/dist-standalone/decimen-sender.html released/decimen-sender.html || true
          cp decimen-optical-transfer/dist-standalone/receive/index.html released/decimen-receiver.html || cp decimen-optical-transfer/dist-standalone/decimen-receiver.html released/decimen-receiver.html || true
      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: optical-transfer-web-standalone
          path: released/

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
        working-directory: ./flutter_optical_transfer
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
        working-directory: ./flutter_optical_transfer
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: optical-transfer-android-apk
          path: flutter_optical_transfer/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
        working-directory: ./flutter_optical_transfer
      - name: Build Windows
        run: flutter build windows --release
        working-directory: ./flutter_optical_transfer
      - name: Archive Windows Release
        run: Compress-Archive -Path flutter_optical_transfer/build/windows/runner/Release/* -DestinationPath flutter_optical_transfer_windows.zip
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: optical-transfer-windows
          path: flutter_optical_transfer_windows.zip

  create-github-release:
    name: Create GitHub Release
    needs: [build-web-standalone, build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            released/decimen-sender.html
            released/decimen-receiver.html
            artifacts/optical-transfer-android-apk/app-release.apk
            artifacts/optical-transfer-windows/flutter_optical_transfer_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
