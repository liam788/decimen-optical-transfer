name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-standalone-web:
    name: Publish Web Releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish Web HTML Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Decimen Optical Transfer — Universal Release
            - Zero-network optical file transfer via light and screen streams.
            - Includes prebuilt single-file standalone web apps (`decimen-sender.html` and `decimen-receiver.html`).
            - Cross-platform Flutter source included in `flutter_optical_transfer/`.
          files: |
            released/decimen-sender.html
            released/decimen-receiver.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          cd flutter_optical_transfer
          flutter pub get
          flutter build apk --release

      - name: Upload Android APK Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: flutter_optical_transfer/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Windows Executable
        run: |
          cd flutter_optical_transfer
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release
          Compress-Archive -Path build/windows/runner/Release/* -DestinationPath ../flutter_optical_transfer_windows.zip

      - name: Upload Windows Software Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: flutter_optical_transfer_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
