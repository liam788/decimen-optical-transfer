name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-standalone-web:
    name: Build & Publish Standalone Releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Standalone Single-File Apps
        run: |
          cd decimen-optical-transfer
          npm install
          npm run build:standalone

      - name: Prepare Released Artifacts
        run: |
          mkdir -p released_assets
          cp decimen-optical-transfer/dist-standalone/send/index.html released_assets/decimen-sender.html || cp released/decimen-sender.html released_assets/decimen-sender.html
          cp decimen-optical-transfer/dist-standalone/receive/index.html released_assets/decimen-receiver.html || cp released/decimen-receiver.html released_assets/decimen-receiver.html

      - name: Create GitHub Release Page
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Decimen Optical Transfer — Universal Release
            - Zero-network optical file transfer via light and screen streams.
            - Includes single-file standalone web apps (`decimen-sender.html` and `decimen-receiver.html`).
            - Cross-platform Flutter source included in `flutter_optical_transfer/`.
          files: |
            released_assets/decimen-sender.html
            released_assets/decimen-receiver.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
