name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Decimen Optical Transfer — Universal Release
            - Zero-network optical file transfer via light and screen streams.
            - Includes prebuilt single-file standalone web apps (`decimen-sender.html` and `decimen-receiver.html`).
            - Cross-platform Flutter source included in `flutter_optical_transfer/`.
          files: |
            released/decimen-sender.html
            released/decimen-receiver.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
