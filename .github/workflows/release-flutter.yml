name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Publish pre-built standalone web HTML
  # ─────────────────────────────────────────────
  publish-web:
    name: Publish Web Releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish Web HTML Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Optical Transfer v2.0.0 — Universal Cross-Platform Release

            Zero-network, air-gapped optical file transfer using fountain-coded visual light streams (screens & cameras).

            ### 🚀 What's New in v2.0.0
            - **Pure Native Windows Application (C# / WPF):** Standalone `OpticalTransfer.exe` with zero external dependencies, 4-layer architecture, optical transfer ring, viewfinder HUD, and live telemetry.
            - **4-Layer System Architecture:** Systematic Fountain Codec (Soliton PRNG, systematic source blocks, repair droplets, peeling solver), DCF2 protocol container with SHA-256 integrity validation.
            - **1-Ahead Frame Pre-generation & VSync Cadence Gating:** 5 to 60 FPS streaming without UI stutter.
            - **2-Slot Atomic Dropping Queue:** High-framerate camera capture with $<0.3\text{ ms}$ buffer copies.
            - **Official Brand Design System:** High-contrast dark theme (#0A0A0A Optical Black, #181B18 Cards, #98B878 Optical Green accent).

            ### 📥 Direct Downloads
            | Platform | File | Notes |
            |---|---|---|
            | 🪟 Windows | `decimen-windows.zip` | Pure Native Windows App (Extract and run `OpticalTransfer.exe`) |
            | 🌐 Web (Sender) | `decimen-sender.html` | Open in any browser offline, no install |
            | 🌐 Web (Receiver) | `decimen-receiver.html` | Open in any browser offline, inlined ZXing scanner |
            | 🤖 Android | `app-release.apk` | Sideload on Android 5.0+ |
            | 🍎 iOS | `decimen-ios.zip` | Unsigned — install via AltStore/Sideloadly |
            | 🖥️ macOS | `decimen-macos.zip` | Unsigned — right-click → Open to bypass Gatekeeper |
          files: |
            released/decimen-sender.html
            released/decimen-receiver.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 2: Build Native Android APK
  # ─────────────────────────────────────────────
  build-android:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradlew Executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload Android APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 3: Build Native Windows Executable & Bundle
  # ─────────────────────────────────────────────
  build-windows:
    name: Build Native Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Native C# / WPF Windows Application
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File windows/build.ps1
          if (-not (Test-Path "windows/bin/OpticalTransfer.exe")) {
            Write-Error "OpticalTransfer.exe was not created"
            exit 1
          }
          Compress-Archive -Path "windows/bin/OpticalTransfer.exe" -DestinationPath "decimen-windows.zip" -Force

      - name: Upload Windows ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: decimen-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 4: Build iOS (unsigned)
  # ─────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Build iOS (no code sign)
        working-directory: flutter_optical_transfer
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Package iOS app as ZIP
        working-directory: flutter_optical_transfer
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r decimen-ios.zip Payload/
          rm -rf Payload

      - name: Upload iOS ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: flutter_optical_transfer/decimen-ios.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # JOB 5: Build macOS (unsigned)
  # ─────────────────────────────────────────────
  build-macos:
    name: Build macOS App (Unsigned)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build macOS
        working-directory: flutter_optical_transfer
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release

      - name: Package macOS app as ZIP
        working-directory: flutter_optical_transfer
        run: |
          cd build/macos/Build/Products/Release
          zip -r $GITHUB_WORKSPACE/flutter_optical_transfer/decimen-macos.zip *.app

      - name: Upload macOS ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: flutter_optical_transfer/decimen-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
