name: flutter_optical_transfer
description: "Universal Cross-Platform Fountain-Coded Optical File Transfer App (iOS, macOS, Android, Windows, Web)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  file_picker: ^8.0.0
  crypto: ^3.0.3
  archive: ^3.4.10
  path: ^1.9.0
  path_provider: ^2.1.2
  share_plus: ^9.0.0
  permission_handler: ^11.3.1
  device_info_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/branding/
